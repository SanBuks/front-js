<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>typeof</title>
</head>
<body>
<script>

let boolean_var = true
let string_var = "string"
let number_var = 3
let object_var = { 'name': "Mike" }
let null_var = null
let function_var = () => { console.log('function var') }
let symbol_var = Symbol('tag')

console.log(typeof undefined_var) // undefined
console.log(typeof boolean_var)   // boolean
console.log(typeof string_var)    // string
console.log(typeof number_var)    // number
console.log(typeof object_var)    // object
console.log(typeof null_var)      // object
console.log(typeof function_var)  // function
console.log(typeof symbol_var)    // symbol

</script>
</body>
</html>
