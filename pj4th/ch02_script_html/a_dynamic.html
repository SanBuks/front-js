<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>dynamic</title>
  <!-- 让预加载器直到动态请求文件的存在  -->
  <link rel="preload" href="a_outer_script.js">
</head>
<body>
<script>
  // 创建 script 节点
  const script = document.createElement('script')
  // src 属性
  script.src = 'a_outer_script.js'
  // 明确同步加载, 默认异步加载
  script.async = false
  // 添加到 DOM 中
  document.head.appendChild(script)
</script>
</body>
</html>
