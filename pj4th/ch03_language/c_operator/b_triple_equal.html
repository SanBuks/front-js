<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>===</title>
</head>
<body>
<script>

  let obj1 = {}
  let obj2 = obj1

  console.log(null !== undefined)  // 类型不同
  console.log(null !== obj1)       // 引用不同
  console.log(obj1 === obj2)       // 引用相同

</script>
</body>
</html>
