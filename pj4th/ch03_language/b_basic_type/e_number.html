<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>number</title>
</head>
<body>
<script>

  // #1. 进制
  let oct = 0o07;  // 0o 开头表示 八进制, 严格模式下 0 开头八进制不允许
  let hex = 0x0F;  // 0x 开头表示 十六进制

  console.log(oct)
  console.log(hex)

  // #2. 浮点数
  let integer = 0.0000000  // 小数点后为 0, 实际转化为整数
  let float = 3e-17        // 科学计数法表示小数
  console.log(integer)
  console.log(float)

  // #3. 最大值, 无穷值, NaN
  console.log(Number.MAX_VALUE)                       // 最大值
  console.log(Infinity)                               // 正无穷大
  console.log(-Infinity)                              // 负无穷大
  console.log(Number.isFinite(Number.MAX_VALUE + 1))  // 判断正无穷大
  console.log(Number.isNaN(Number.NaN + 1))           // NaN
  console.log(NaN != NaN)                             // NaN != NaN

  // #4. isNaN 的参数会进行转换 相当于 Number.isNaN((Number(var)))
  console.log(Number.isNaN("123"))  // false

</script>
</body>
</html>
