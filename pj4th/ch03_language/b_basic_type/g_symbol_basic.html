<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>symbol_basic</title>
</head>
<body>
<script>

  // #1. Symbol() 创建的对象都是独一无二的值, 即使 description 一样
  let sym1 = Symbol('foo')
  let sym2 = Symbol('foo')
  console.log(sym1 == sym2)    // 独一无二, false
  console.log(sym1.toString()) // 打印标签, "foo"

  // #2. symbol 无法通过 new 创建包装对象
  //     可以通过 Object(sym) 形式创建
  let numObj = new Number(3)
  console.log(typeof numObj)         // object
  // let noSymbolObj = new Symbol(); // error
  let symObj = Object(Symbol())
  console.log(typeof symObj)         // object

  // #3. Symbol.for 注册的全局对象是唯一的, 如果键不存在则默认注册后返回符号
  let sym3 = Symbol.for('foo')
  let sym4 = Symbol.for('foo')
  console.log(sym3 === sym4)  // true

  // #4. 获取全局 symbol 的键
  console.log(Symbol.keyFor(sym3))

</script>
</body>
</html>
